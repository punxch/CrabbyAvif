name: Clippy
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# Cancel the workflow if a new one is triggered from the same PR, branch, or tag, except on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  clippy:
    name: "Clippy"
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup-deps
    - run: cargo clippy --version
    - run: cargo clippy --no-default-features
    - run: cargo clippy --no-default-features --features=capi
    - run: cargo clippy --no-default-features --features native
    - run: cargo clippy --no-default-features --features native --tests
    - run: cargo clippy --no-default-features --features native --examples
    - run: cargo clippy --no-default-features --features native,aom
    - run: cargo clippy --no-default-features --features native,aom,capi
    - run: cargo clippy --no-default-features --features native,aom --tests
    - run: cargo clippy --no-default-features --features native,aom --examples
